    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "LivingRoomightOn"}'


  turn_off_Kabinet_lights:
    url: 'http://213.171.3.3:8000/send-message'
    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "KabinetLightOff"}'
  turn_on_Kabinet_lights:
