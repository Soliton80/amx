    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "BathightOn"}'

# Include automations and scripts
automation: !include automations.yaml
script: !include scripts.yaml

# Define input boolean
input_boolean:
  Bedroom_light_switch:
    name: Bedroom Light Switch
    initial: off
    icon: mdi:light-switch

  Kitchen_light_switch:
    name: Kitchen Light Switch
    initial: off
    icon: mdi:light-switch
    
  LivingRoom_light_switch:
    name: LivingRoom Light Switch
    initial: off
    icon: mdi:light-switch

    
  Kabinet_light_switch:
    name: Kabinet Light Switch
    initial: off
    icon: mdi:light-switch

    
  ChildRoom_light_switch:
    name: ChildRoom Light Switch
    initial: off
    icon: mdi:light-switch

    
  Hall_light_switch:
    name: Hall Light Switch
    initial: off
    icon: mdi:light-switch

    
  Bath_light_switch:
    name: Bath Light Switch
    initial: off
    icon: mdi:light-switch

# Enable HomeKit integration
homekit:
  auto_start: true
  filter:
    include_entities:
      - input_boolean.Bedroom_light_switch
      - input_boolean.Kitchen_light_switch
      - input_boolean.LivingRoom_light_switch
      - input_boolean.Kabinet_light_switch
      - input_boolean.ChildRoom_light_switch
      - input_boolean.Hall_light_switch
      - input_boolean.Bath_light_switch

# Enable debug logging for automations
logger:
  default: info
  logs:
    homeassistant.components.automation: debug
    homeassistant.components.rest_command: debug
