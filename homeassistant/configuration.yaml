# Define REST commands
rest_command:
  turn_off_lights:
    url: 'http://213.171.3.3:8000/send-message'
    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "TurnOffLights"}'
  turn_off_bedroom_lights:
    url: 'http://213.171.3.3:8000/send-message'
    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "BedroomLightsTurnOff"}'
  turn_on_bedroom_lights:
    url: 'http://213.171.3.3:8000/send-message'
    method: POST
    headers:
      Content-Type: 'application/json'
    payload: '{"message": "BedroomLightsTurnOn"}'

# Include automations and scripts
automation: !include automations.yaml
script: !include scripts.yaml

# Define input boolean
input_boolean:
  bedroom_light_switch:
    name: Bedroom Light Switch
    initial: off
    icon: mdi:light-switch

# Enable HomeKit integration
homekit:
  auto_start: true
  filter:
    include_entities:
      - input_boolean.bedroom_light_switch

# Enable debug logging for automations
logger:
  default: info
  logs:
    homeassistant.components.automation: debug
    homeassistant.components.rest_command: debug
